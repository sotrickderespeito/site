name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"] # Executa quando houver push nas branches 'main' ou 'master'
  workflow_dispatch: # Permite rodar o workflow de forma manual pela aba Actions do GitHub

# Permissões necessárias para publicar usando o novo método de deploy direto de Actions do GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Garante que apenas um deploy aconteça por vez
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Envia toda a pasta raiz diretamente (index.html, sobre.html, contato.html, src)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
