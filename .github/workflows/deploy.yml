name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"] # Executa quando houver push nas branches 'main' ou 'master'
  workflow_dispatch: # Permite rodar o workflow de forma manual pela aba Actions do GitHub

# Permissões necessárias para publicar usando o novo método de deploy direto de Actions do GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Garante que apenas um deploy aconteça por vez
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build project
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Pasta que contém o site compilado

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
