name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"] # Executa quando houver push nas branches 'main' ou 'master'
  workflow_dispatch: # Permite rodar o workflow de forma manual pela aba Actions do GitHub

# Concede permissão para fazer commit da pasta dist/ compilada na branch gh-pages
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Pasta que contém o site compilado
          branch: gh-pages # Branch específica onde ficará o build final do site
